<!-- Basma Tech Horizontal Logo — Liquid Pastel system (2026-05) — mark left, wordmarks right -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 120" width="640" height="120">
  <defs>
    <linearGradient id="liquid-mint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A8E5C5"/>
      <stop offset="100%" stop-color="#5FE99A"/>
    </linearGradient>
    <linearGradient id="liquid-azure" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B5D5EE"/>
      <stop offset="100%" stop-color="#5FA9F0"/>
    </linearGradient>
    <linearGradient id="liquid-pink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFD3DD"/>
      <stop offset="100%" stop-color="#FF5A9E"/>
    </linearGradient>
  </defs>

  <!-- Stacked-layer liquid mark -->
  <g transform="translate(70, 60)">
    <path d="M -55 -8 Q -42 -28, -10 -32 Q 22 -32, 50 -12 Q 38 -22, 8 -24 Q -22 -24, -48 -8 Z"
          fill="url(#liquid-mint)" opacity="0.92" transform="translate(0,-22)"/>
    <path d="M -55 -8 Q -42 -28, -10 -32 Q 22 -32, 50 -12 Q 38 -22, 8 -24 Q -22 -24, -48 -8 Z"
          fill="url(#liquid-azure)" opacity="0.92"/>
    <path d="M -55 -8 Q -42 -28, -10 -32 Q 22 -32, 50 -12 Q 38 -22, 8 -24 Q -22 -24, -48 -8 Z"
          fill="url(#liquid-pink)" opacity="0.92" transform="translate(0,22)"/>
  </g>

  <!-- Latin Wordmark: Basma Tech (Bricolage 800) -->
  <text x="160" y="58"
        font-family="Bricolage Grotesque, system-ui, sans-serif"
        font-weight="800"
        font-size="38"
        letter-spacing="-1"
        fill="#14152B">Basma Tech</text>

  <!-- Vertical divider -->
  <line x1="395" y1="32" x2="395" y2="88" stroke="#9091A6" stroke-width="1" opacity="0.4"/>

  <!-- Arabic Wordmark: بصمة تك (Cairo 900) -->
  <text x="415" y="74"
        font-family="Cairo, sans-serif"
        font-weight="900"
        font-size="42"
        fill="#14152B"
        direction="rtl"
        unicode-bidi="bidi-override">بصمة تك</text>
</svg>
