<!-- Basma Tech White/Reversed Logo — Liquid Pastel system (2026-05) — wordmark white on dark, mark stays liquid -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 160" width="420" height="160">
  <defs>
    <linearGradient id="liquid-mint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A8E5C5"/>
      <stop offset="100%" stop-color="#5FE99A"/>
    </linearGradient>
    <linearGradient id="liquid-azure" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B5D5EE"/>
      <stop offset="100%" stop-color="#5FA9F0"/>
    </linearGradient>
    <linearGradient id="liquid-pink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFD3DD"/>
      <stop offset="100%" stop-color="#FF5A9E"/>
    </linearGradient>
  </defs>

  <!-- Stacked-layer liquid mark (works on dark backgrounds) -->
  <g transform="translate(80, 80)">
    <path d="M -55 -8 Q -42 -28, -10 -32 Q 22 -32, 50 -12 Q 38 -22, 8 -24 Q -22 -24, -48 -8 Z"
          fill="url(#liquid-mint)" opacity="0.92" transform="translate(0,-26)"/>
    <path d="M -55 -8 Q -42 -28, -10 -32 Q 22 -32, 50 -12 Q 38 -22, 8 -24 Q -22 -24, -48 -8 Z"
          fill="url(#liquid-azure)" opacity="0.92"/>
    <path d="M -55 -8 Q -42 -28, -10 -32 Q 22 -32, 50 -12 Q 38 -22, 8 -24 Q -22 -24, -48 -8 Z"
          fill="url(#liquid-pink)" opacity="0.92" transform="translate(0,26)"/>
  </g>

  <!-- Wordmark: Latin (Bricolage 800) + Arabic (Cairo 900) — white -->
  <g transform="translate(170, 0)">
    <text x="0" y="78"
          font-family="Bricolage Grotesque, system-ui, sans-serif"
          font-weight="800"
          font-size="44"
          letter-spacing="-1"
          fill="#F5F5F8">Basma Tech</text>
    <text x="0" y="118"
          font-family="Cairo, sans-serif"
          font-weight="900"
          font-size="32"
          fill="#F5F5F8"
          direction="rtl"
          unicode-bidi="bidi-override">بصمة تك</text>
  </g>
</svg>
